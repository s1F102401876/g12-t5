# SafeCare-AI CI/CD Pipeline

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # バックエンドテスト
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 依存関係のインストール
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system .
          pip install pytest pytest-cov pytest-asyncio

      - name: リンターの実行
        working-directory: ./backend
        run: |
          pip install ruff
          ruff check . --fix
          ruff check .

      - name: テストの実行
        working-directory: ./backend
        run: |
          python -m pytest tests/ -v --cov=safecare --cov-report=xml

  # フロントエンドテスト
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 依存関係のインストール
        working-directory: ./frontend
        run: npm ci

      - name: リンターの実行
        working-directory: ./frontend
        run: npx eslint . --ext .ts,.tsx,.js,.jsx

      - name: テストの実行
        working-directory: ./frontend
        run: npm test -- --coverage

      - name: ビルドの実行
        working-directory: ./frontend
        run: npm run build